global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['10.200.0.1:9100']
        labels: {instance: 'node1'}
      - targets: ['10.200.0.2:9100']
        labels: {instance: 'node2'}
      - targets: ['10.200.0.3:9100']
        labels: {instance: 'node3'}

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
