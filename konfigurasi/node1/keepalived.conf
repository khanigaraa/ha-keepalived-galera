vrrp_script cek_nginx {
    script "/etc/keepalived/cek_nginx.sh"
    interval 1
    timeout 3
    weight -120
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface vxlan0
    virtual_router_id 51
    priority 200
    advert_int 0.5

    unicast_src_ip 10.200.0.1
    unicast_peer {
        10.200.0.2
    }

    authentication {
        auth_type PASS
        # Ganti dengan sandi VRRP yang sama di node1 & node2 (maks. 8 karakter)
        auth_pass GANTI123
    }

    virtual_ipaddress {
        10.200.0.100/24 dev vxlan0
    }

    track_script {
        cek_nginx
    }
}
