server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ifjudul;
    index index.php;

    access_log /var/log/nginx/ifjudul_access.log;
    error_log  /var/log/nginx/ifjudul_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 30;
    }

    location ~ ^/(02_isi_data\.php|01_skema\.sql)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /sehat {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }
}
